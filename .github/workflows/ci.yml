name: CI

on:
  push:
  pull_request:

# A newer push to the same ref makes the running check obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Single source of truth: the toolchain comes from go.mod.
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: build
        run: go build ./...

      # The README promises a pure-Go binary (modernc SQLite, no cgo). Build it
      # that way here so the claim is checked instead of assumed.
      - name: build without cgo
        env:
          CGO_ENABLED: 0
        run: go build ./...

      - name: vet
        run: go vet ./...

      - name: test
        run: go test ./... -count=1

      # The TUI runs commands on their own goroutines; the race detector is the
      # only thing that catches a closure reaching back into model state.
      - name: test with race detector
        run: go test ./... -count=1 -race -timeout 5m
